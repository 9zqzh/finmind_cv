name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'release' && 'production' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

env:
  ACR_REGISTRY: crpi-q46i31ygwyvi127o.cn-guangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME: crpi-q46i31ygwyvi127o.cn-guangzhou.personal.cr.aliyuncs.com/liangjz1/finmind

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install ./packages/gduf-academic-api
          python -m pip install "./backend[test]"

      - name: Test backend
        run: |
          python -m pytest backend/tests
          python -m pytest packages/gduf-academic-api/tests -o addopts=""

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  build:
    name: Build ${{ matrix.component }} image
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            dockerfile: frontend/Dockerfile
          - component: backend
            dockerfile: backend/Dockerfile

    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.component }}-${{ github.event.release.tag_name }}
            type=raw,value=${{ matrix.component }}-${{ github.sha }}
            type=raw,value=${{ matrix.component }}-latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # ACR 个人版当前不接受 BuildKit provenance/SBOM 附加清单。
          provenance: false
          sbom: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy production
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload production Compose file
        run: |
          scp -P "${{ secrets.SSH_PORT }}" \
            compose.prod.yaml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/compose.prod.yaml"

      - name: Pull images and restart services
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e; mkdir -p ~/finmind; mv ~/compose.prod.yaml ~/finmind/compose.prod.yaml; cd ~/finmind; test -f .env || { echo 'Missing ~/finmind/.env' >&2; exit 1; }; IMAGE_TAG=${{ github.sha }} docker compose --env-file .env -f compose.prod.yaml pull; IMAGE_TAG=${{ github.sha }} docker compose --env-file .env -f compose.prod.yaml up -d --remove-orphans"

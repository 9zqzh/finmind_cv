[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "college-assistant-backend"
version = "0.1.0"
description = "学院教学小助手 Agent 骨架（PydanticAI + DeepSeek）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai>=1.0,<3",
    "pydantic-settings>=2.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# 本地教务接口包（可编辑安装）：
#   pip install -e ../gdufjwxtapi
# 不写进 dependencies 是为了保证 pyproject 在其他机器上仍可解析。

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "college-assistant-backend"
version = "0.1.0"
description = "学院教学小助手 Agent 骨架（PydanticAI + DeepSeek）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai>=1.0,<3",
    "pydantic-settings>=2.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "chromadb>=1,<2",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.16,<2",
    "cryptography>=45,<51",
    "gduf-jwxt-api==0.3.0",
    "gduf-web-api==0.2.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20,<1",
]
tools = [
    "openpyxl>=3.1,<4",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "pywin32>=306; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>数智金院 - AI 对话</title>
<style>
  :root {
    --primary: #1677ff;
    --primary-dark: #0958D9;
    --bg: #f0f4fa;
    --surface: #ffffff;
    --text: #1d2939;
    --text-secondary: #667085;
    --text-tertiary: #98a2b3;
    --border: #e5e7eb;
    --user-bubble: #e6f4ff;
    --ai-bubble: #ffffff;
    --thinking-bg: #f0f5ff;
    --thinking-border: #d6e4ff;
    --success: #52c41a;
    --shadow-card: 0 2px 12px rgba(22, 119, 255, 0.06);
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #e8ecf0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px 0;
  }

  .phone {
    width: 375px;
    min-height: 812px;
    height: 812px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    border-radius: 40px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12), inset 0 0 0 2px #d1d5db;
    display: flex;
    flex-direction: column;
  }

  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 36px;
    background: #000;
    border-radius: 20px;
    z-index: 100;
  }

  /* Status Bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px 0;
    height: 54px;
    background: var(--primary);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 16px; height: 16px; fill: #fff; }
  .battery-icon { width: 25px !important; height: 12px !important; }

  /* Header */
  .header {
    background: var(--primary);
    padding: 4px 16px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .header-back {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .header-back svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .header-title {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    flex: 1;
    text-align: center;
    margin-right: 36px;
  }

  /* Chat Area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Welcome Card (shown when no messages) */
  .welcome-card {
    display: none; /* Hidden since we have messages */
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 32px 20px;
    text-align: center;
    margin: auto 0;
  }
  .welcome-logo {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: linear-gradient(135deg, #e6f4ff, #f0f5ff);
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .welcome-logo svg { width: 36px; height: 36px; stroke: var(--primary); fill: none; stroke-width: 1.5; }
  .welcome-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }
  .welcome-subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .quick-questions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .quick-btn {
    padding: 8px 14px;
    border-radius: 18px;
    border: 1px solid #d6e4ff;
    background: #f0f5ff;
    color: var(--primary);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.01em;
  }

  /* Message */
  .message {
    display: flex;
    gap: 10px;
    max-width: 100%;
  }
  .message.user {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar.user-avatar {
    background: var(--primary);
  }
  .avatar.user-avatar svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; }
  .avatar.ai-avatar {
    background: var(--success);
  }
  .avatar.ai-avatar svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; }

  .message-content {
    max-width: 260px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    letter-spacing: 0.01em;
  }
  .message.user .bubble {
    background: var(--user-bubble);
    color: var(--text);
    border: 1px solid #d6e4ff;
  }
  .message.ai .bubble {
    background: var(--ai-bubble);
    color: var(--text);
    border: 1px solid #f0f0f0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }

  /* Thinking Block */
  .thinking-block {
    background: var(--thinking-bg);
    border: 1px solid var(--thinking-border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .thinking-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
    cursor: pointer;
  }
  .thinking-header svg { width: 14px; height: 14px; stroke: var(--primary); fill: none; stroke-width: 2; }
  .thinking-body {
    padding: 0 12px 10px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .thinking-step {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
  }
  .step-icon {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .step-icon.done { background: #f0f9eb; }
  .step-icon.done svg { width: 10px; height: 10px; stroke: var(--success); fill: none; stroke-width: 3; }
  .step-icon.loading { background: #e6f4ff; }
  .step-icon.loading svg { width: 10px; height: 10px; stroke: var(--primary); fill: none; stroke-width: 2; }

  /* Result Card (Schedule Table) */
  .result-card {
    background: var(--surface);
    border: 1px solid #eef2f7;
    border-radius: var(--radius-sm);
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .result-card-header {
    background: #eef7ff;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    color: #164b80;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .result-card-header svg { width: 14px; height: 14px; stroke: #164b80; fill: none; stroke-width: 2; }
  .result-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
  }
  .result-table th {
    background: #f5f9ff;
    padding: 6px 8px;
    text-align: left;
    font-weight: 500;
    color: var(--text-secondary);
    border-bottom: 1px solid #eef2f7;
    font-size: 10px;
    letter-spacing: 0.02em;
  }
  .result-table td {
    padding: 6px 8px;
    color: var(--text);
    border-bottom: 1px solid #f5f5f5;
    font-size: 11px;
  }
  .result-table tr:last-child td { border-bottom: none; }

  /* Source line */
  .source-line {
    font-size: 11px;
    color: var(--text-tertiary);
    padding: 0 2px;
  }

  /* Input Bar */
  .input-bar {
    padding: 10px 16px;
    padding-bottom: 14px;
    border-top: 1px solid #eef2f7;
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .input-field {
    flex: 1;
    height: 40px;
    border-radius: 20px;
    border: 1.5px solid #e5e7eb;
    padding: 0 16px;
    font-size: 14px;
    color: var(--text);
    background: #f8fafc;
    outline: none;
    font-family: inherit;
  }
  .input-field::placeholder { color: var(--text-tertiary); }
  .input-field:focus { border-color: var(--primary); background: #fff; }
  .send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--primary);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .send-btn svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Bottom Tab Bar */
  .tab-bar {
    height: 88px;
    background: var(--surface);
    border-top: 1px solid #eef2f7;
    display: flex;
    padding-top: 8px;
    padding-bottom: 28px;
    flex-shrink: 0;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    text-decoration: none;
    position: relative;
  }
  .tab-item svg {
    width: 24px;
    height: 24px;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke: #98a2b3;
  }
  .tab-label {
    font-size: 10px;
    color: #98a2b3;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .tab-item.active svg { stroke: var(--primary); }
  .tab-item.active .tab-label { color: var(--primary); font-weight: 600; }
  .tab-item.active::before {
    content: '';
    position: absolute;
    top: -9px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 3px;
    background: var(--primary);
    border-radius: 2px;
  }

  /* Home Indicator */
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: #000;
    border-radius: 3px;
    opacity: 0.2;
    z-index: 200;
  }
</style>
</head>
<body>
<div class="phone" data-component="AI Chat Page">

  <div class="dynamic-island"></div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 18 12"><path d="M1 4.5C3.5 1.5 7 0 9 0s5.5 1.5 8 4.5" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M3 7C5 5 7 4 9 4s4 1 6 3" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="9" cy="10" r="1.5" fill="#fff"/></svg>
      <svg viewBox="0 0 16 12"><rect x="0" y="2" width="3" height="8" rx="0.5" fill="#fff" opacity="0.4"/><rect x="4" y="1" width="3" height="9" rx="0.5" fill="#fff" opacity="0.6"/><rect x="8" y="0" width="3" height="10" rx="0.5" fill="#fff" opacity="0.8"/><rect x="12" y="0" width="3" height="10" rx="0.5" fill="#fff"/></svg>
      <svg class="battery-icon" viewBox="0 0 28 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3" fill="none" stroke="#fff" stroke-width="1"/><rect x="25" y="4" width="2.5" height="5" rx="1" fill="#fff" opacity="0.5"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="#fff"/></svg>
    </div>
  </div>

  <!-- Header -->
  <div class="header" data-component="Chat Header">
    <div class="header-back">

    </div>
    <span class="header-title">AI 对话</span>
  </div>

  <!-- Chat Area -->
  <div class="chat-area" data-component="Chat Messages">

    <!-- User Message -->
    <div class="message user">
      <div class="avatar user-avatar">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>

    <!-- AI Message with Thinking + Result -->
    <div class="message ai">

      </div>
      <div class="message-content">
        <!-- Thinking Block -->
        <div class="thinking-block">
          <div class="thinking-header">
            <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 017 7c0 2.38-1.19 4.47-3 5.74V17a1 1 0 01-1 1H9a1 1 0 01-1-1v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 017-7z"/></svg>
            <span>AI 思考过程</span>
          </div>
          <div class="thinking-body">
            <div class="thinking-step">
              <div class="step-icon done">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>

              <span>查询教务系统课表数据</span>
            </div>
            <div class="thinking-step">
              <div class="step-icon done">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
              <span>筛选今日（周四）课程</span>
            </div>
            <div class="thinking-step">
              <div class="step-icon done">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
              <span>整理课程信息并格式化</span>
            </div>
          </div>
        </div>

        <!-- AI Reply Bubble -->
        <div class="bubble">
          你今天（周四）共有 <strong>3 节课</strong>，安排如下：
        </div>

        <!-- Schedule Result Card -->
        <div class="result-card">
          <div class="result-card-header">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>

              </tr>
              <tr>
                <td>计算机网络原理</td>
                <td>3-4 节</td>
                <td>实训 A405</td>
              </tr>
              <tr>
                <td>数据结构与算法</td>
                <td>6-7 节</td>
                <td>南教 213</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="source-line">来源：教务系统 · 2025-2026 学年第二学期</div>
      </div>
    </div>

    <!-- Second User Message -->
    <div class="message user">
      <div class="avatar user-avatar">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="message-content">
        <div class="bubble">下午的课在哪个教学楼？</div>
      </div>
    </div>

    <!-- Second AI Reply -->
    <div class="message ai">
      <div class="avatar ai-avatar">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="3"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
      </div>
      <div class="message-content">
        <div class="bubble">
          你下午的课程是<strong>「数据结构与算法」</strong>，在第 6-7 节（14:00-15:30），教室在<strong>清远南教 213</strong>。建议提前 10 分钟到教室准备。
        </div>
      </div>
    </div>

  </div>

  <!-- Input Bar -->
  <div class="input-bar" data-component="Chat Input">
    <input class="input-field" type="text" placeholder="输入你的问题..." readonly>
    <button class="send-btn">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

  <!-- Bottom Tab Bar -->
  <nav class="tab-bar" data-component="Bottom Navigation">
    <a class="tab-item" href="#">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>

    <a class="tab-item" href="#">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>

  </nav>

  <div class="home-indicator"></div>

</div>
</body>
</html>

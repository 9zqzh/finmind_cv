<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>数智金院 - 首页</title>
<style>
  :root {
    --primary: #1677ff;
    --primary-dark: #0958D9;
    --bg: #f0f4fa;
    --surface: #ffffff;
    --text: #1d2939;
    --text-secondary: #667085;
    --text-tertiary: #98a2b3;
    --border: #e5e7eb;
    --header-gradient: linear-gradient(135deg, #1677ff 0%, #4096ff 100%);
    --brand-gradient: linear-gradient(120deg, #1e3a8a 0%, #3f5be0 35%, #5b6ee8 70%, #2a7fe0 100%);
    --shadow-card: 0 2px 12px rgba(22, 119, 255, 0.06);
    --shadow-card-hover: 0 4px 16px rgba(22, 119, 255, 0.12);
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #e8ecf0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px 0;
  }

  .phone {
    width: 375px;
    min-height: 812px;
    background: var(--bg);
    position: relative;
    overflow-x: hidden;
    border-radius: 40px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12), inset 0 0 0 2px #d1d5db;
  }

  /* Status Bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px 0;
    height: 54px;
    background: var(--primary);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .status-bar .time { font-variant-numeric: tabular-nums; }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 16px; height: 16px; fill: #fff; }
  .battery-icon { width: 25px !important; height: 12px !important; }

  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 36px;
    background: #000;
    border-radius: 20px;
    z-index: 100;
  }

  /* Header */
  .header {
    background: var(--primary);
    padding: 4px 20px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-logo {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, #fff 0%, #e6f4ff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .header-logo svg { width: 28px; height: 28px; }
  .header-title {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.04em;
    text-shadow: 0 1px 3px rgba(0,0,0,0.12);
  }
  .header-right {
    margin-left: auto;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .header-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header-icon svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Main Content */
  .content {
    padding: 16px;
    padding-bottom: 100px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Card base */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 16px 0;
  }
  .card-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .card-link {
    font-size: 13px;
    color: var(--primary);
    text-decoration: none;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  /* Today's Courses */
  .course-list {
    padding: 12px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .course-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #f0f2f5;
  }
  .course-item:last-child { border-bottom: none; padding-bottom: 0; }
  .course-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
    margin-top: 6px;
    flex-shrink: 0;
  }
  .course-info { flex: 1; }
  .course-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 4px;
  }
  .course-meta {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.4;
    letter-spacing: 0.01em;
  }
  .course-time {
    font-size: 13px;
    color: var(--primary);
    font-weight: 600;
    flex-shrink: 0;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  /* Todo List */
  .todo-list {
    padding: 12px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #f0f2f5;
  }
  .todo-item:last-child { border-bottom: none; }
  .todo-checkbox {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid #d1d5db;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .todo-checkbox.checked {
    background: var(--primary);
    border-color: var(--primary);
  }
  .todo-checkbox.checked svg { width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 3; }
  .todo-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.4;
    flex: 1;
  }
  .todo-text.completed {
    text-decoration: line-through;
    color: var(--text-tertiary);
  }
  .todo-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }
  .todo-tag.urgent { background: #fff1f0; color: #cf1322; }
  .todo-tag.normal { background: #e6f4ff; color: #1677ff; }
  .todo-tag.low { background: #f6ffed; color: #389e0d; }

  .todo-input-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px 14px;
    border-top: 1px solid #f0f2f5;
  }
  .todo-input {
    flex: 1;
    height: 36px;
    border-radius: 18px;
    border: 1.5px solid #e5e7eb;
    padding: 0 14px;
    font-size: 13px;
    color: var(--text);
    background: #f8fafc;
    outline: none;
    font-family: inherit;
  }
  .todo-input::placeholder { color: var(--text-tertiary); }
  .todo-input:focus { border-color: var(--primary); background: #fff; }
  .todo-add-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--primary);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .todo-add-btn svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.5; }
  .todo-camera-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #f0f5ff;
    border: 1.5px solid #d6e4ff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
  }
  .todo-camera-btn svg { width: 18px; height: 18px; stroke: var(--primary); fill: none; stroke-width: 2; }
  .camera-tooltip {
    position: absolute;
    bottom: -24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--text-tertiary);
    white-space: nowrap;
  }

  /* Function Hall */
  .function-hall { padding: 0; }
  .function-hall .card-header { padding: 16px 16px 12px; }
  .func-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px 0;
    padding: 0 12px 20px;
  }
  .func-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 8px 4px;
    cursor: pointer;
    text-decoration: none;
  }
  .func-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .func-icon svg { width: 24px; height: 24px; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .func-label {
    font-size: 11px;
    color: var(--text);
    text-align: center;
    line-height: 1.3;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  /* Icon background colors */
  .bg-blue { background: #e6f4ff; }
  .bg-blue svg { stroke: #1677ff; }
  .bg-green { background: #f0f9eb; }
  .bg-green svg { stroke: #389e0d; }
  .bg-orange { background: #fff7e6; }
  .bg-orange svg { stroke: #d46b08; }
  .bg-purple { background: #f0f0ff; }
  .bg-purple svg { stroke: #531dab; }
  .bg-pink { background: #fff0f6; }
  .bg-pink svg { stroke: #c41d7f; }
  .bg-cyan { background: #e6fffb; }
  .bg-cyan svg { stroke: #08979c; }
  .bg-yellow { background: #fffbe6; }
  .bg-yellow svg { stroke: #ad8b00; }
  .bg-red { background: #fff1f0; }
  .bg-red svg { stroke: #cf1322; }
  .bg-teal { background: #e6fffb; }
  .bg-teal svg { stroke: #08979c; }
  .bg-indigo { background: #f0f5ff; }
  .bg-indigo svg { stroke: #2f54eb; }
  .bg-lime { background: #fcffe6; }
  .bg-lime svg { stroke: #5b8c00; }
  .bg-geek { background: #f9f0ff; }
  .bg-geek svg { stroke: #722ed1; }

  /* Bottom Tab Bar */
  .tab-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 88px;
    background: var(--surface);
    border-top: 1px solid #eef2f7;
    display: flex;
    padding-top: 8px;
    padding-bottom: 28px;
    z-index: 50;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    text-decoration: none;
    position: relative;
  }
  .tab-item svg {
    width: 24px;
    height: 24px;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke: #98a2b3;
  }
  .tab-label {
    font-size: 10px;
    color: #98a2b3;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .tab-item.active svg { stroke: var(--primary); }
  .tab-item.active .tab-label { color: var(--primary); font-weight: 600; }
  .tab-item.active::before {
    content: '';
    position: absolute;
    top: -9px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 3px;
    background: var(--primary);
    border-radius: 2px;
  }

  /* Home indicator */
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: #000;
    border-radius: 3px;
    opacity: 0.2;
    z-index: 200;
  }
</style>
</head>

<div class="phone" data-component="Home Page">

  <!-- Dynamic Island -->
  <div class="dynamic-island"></div>

  <!-- Status Bar -->
  <div class="status-bar">

    <div class="status-icons">
      <svg viewBox="0 0 18 12"><path d="M1 4.5C3.5 1.5 7 0 9 0s5.5 1.5 8 4.5" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M3 7C5 5 7 4 9 4s4 1 6 3" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="9" cy="10" r="1.5" fill="#fff"/></svg>

  <!-- Header -->

  <!-- Main Content -->

    <!-- Today's Courses Card -->

      <div class="course-list">
        <div class="course-item">
          <div class="course-dot"></div>
          <div class="course-info">
            <div class="course-name">高等数学 (下)</div>

          <div class="course-dot"></div>

    <!-- Todo List Card -->

        <!-- Row 3 -->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>数智金院 - 我的</title>
<style>
  :root {
    --primary: #1677ff;
    --primary-dark: #0958D9;
    --bg: #f0f4fa;
    --surface: #ffffff;
    --text: #1d2939;
    --text-secondary: #667085;
    --text-tertiary: #98a2b3;
    --border: #e5e7eb;
    --shadow-card: 0 2px 12px rgba(22, 119, 255, 0.06);
    --radius: 12px;
    --radius-sm: 8px;
    --danger: #dc2626;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #e8ecf0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px 0;
  }

  .phone {
    width: 375px;
    min-height: 812px;
    background: var(--bg);
    position: relative;
    overflow-x: hidden;
    border-radius: 40px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12), inset 0 0 0 2px #d1d5db;
  }

  .dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 36px;
    background: #000;
    border-radius: 20px;
    z-index: 100;
  }

  /* Status Bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px 0;
    height: 54px;
    background: linear-gradient(135deg, #1677ff 0%, #4096ff 100%);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
  }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons svg { width: 16px; height: 16px; fill: #fff; }
  .battery-icon { width: 25px !important; height: 12px !important; }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1677ff 0%, #4096ff 100%);
    padding: 4px 20px 0;
    text-align: center;
    position: relative;
  }
  .header-title {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
  }

  /* Profile Card */
  .profile-card {
    background: linear-gradient(135deg, #1677ff 0%, #4096ff 50%, #69b1ff 100%);
    padding: 20px 20px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    overflow: hidden;
  }
  .profile-card::before {
    content: '';
    position: absolute;
    top: -30px;
    right: -30px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
  .profile-card::after {
    content: '';
    position: absolute;
    bottom: -20px;
    left: -20px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
  }

  .avatar-circle {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    border: 3px solid rgba(255,255,255,0.4);
    z-index: 1;
  }
  .avatar-circle span {
    font-size: 30px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  .avatar-edit {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    z-index: 2;
  }
  .avatar-edit svg { width: 12px; height: 12px; stroke: var(--primary); fill: none; stroke-width: 2; }

  .profile-info { z-index: 1; }
  .profile-name {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
    letter-spacing: 0.02em;
  }
  .profile-id {
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }

  /* Content */
  .content {
    padding: 16px;
    padding-bottom: 110px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Academic Info Card */
  .academic-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 18px 16px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 12px 8px;
  }
  .academic-item {
    text-align: center;
  }
  .academic-label {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-bottom: 6px;
    letter-spacing: 0.02em;
    font-weight: 500;
  }
  .academic-value {
    font-size: 13px;
    color: var(--text);
    font-weight: 600;
    line-height: 1.3;
    word-break: break-all;
  }

  /* Settings Card */
  .settings-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }

  .setting-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 16px;
    border-bottom: 1px solid #f5f7fa;
    text-decoration: none;
    cursor: pointer;
  }
  .setting-item:last-child { border-bottom: none; }

  .setting-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .setting-icon svg { width: 18px; height: 18px; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .setting-icon.theme { background: #f0f5ff; }
  .setting-icon.theme svg { stroke: #2f54eb; }
  .setting-icon.bell { background: #fff7e6; }
  .setting-icon.bell svg { stroke: #d46b08; }
  .setting-icon.feedback { background: #f0f9eb; }
  .setting-icon.feedback svg { stroke: #389e0d; }
  .setting-icon.service { background: #e6f4ff; }
  .setting-icon.service svg { stroke: #1677ff; }
  .setting-icon.about { background: #f9f0ff; }
  .setting-icon.about svg { stroke: #722ed1; }

  .setting-text {
    flex: 1;
    font-size: 15px;
    color: var(--text);
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .setting-value {
    font-size: 13px;
    color: var(--text-tertiary);
    margin-right: 4px;
    letter-spacing: 0.01em;
  }
  .setting-arrow {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }
  .setting-arrow svg { width: 16px; height: 16px; stroke: #c0c8d4; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Theme Toggle Preview */
  .theme-preview {
    display: flex;
    gap: 6px;
    margin-right: 4px;
  }
  .theme-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid transparent;
  }
  .theme-dot.light { background: #f5f9ff; border-color: var(--primary); }
  .theme-dot.dark { background: #1d2939; border-color: #475467; }

  /* Logout */
  .logout-section {
    text-align: center;
    padding: 8px 0;
  }
  .logout-btn {
    display: inline-block;
    padding: 12px 32px;
    color: var(--danger);
    font-size: 15px;
    font-weight: 500;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    cursor: pointer;
    border: none;
    font-family: inherit;
    letter-spacing: 0.02em;
  }

  /* Bottom Tab Bar */
  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 375px;
    height: 88px;
    background: var(--surface);
    border-top: 1px solid #eef2f7;
    display: flex;
    padding-top: 8px;
    padding-bottom: 28px;
    z-index: 50;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    text-decoration: none;
    position: relative;
  }
  .tab-item svg {
    width: 24px;
    height: 24px;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke: #98a2b3;
  }
  .tab-label {
    font-size: 10px;
    color: #98a2b3;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .tab-item.active svg { stroke: var(--primary); }
  .tab-item.active .tab-label { color: var(--primary); font-weight: 600; }
  .tab-item.active::before {
    content: '';
    position: absolute;
    top: -9px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 3px;
    background: var(--primary);
    border-radius: 2px;
  }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: #000;
    border-radius: 3px;
    opacity: 0.2;
    z-index: 200;
  }
</style>
</head>
